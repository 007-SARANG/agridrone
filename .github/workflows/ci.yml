name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install lightweight deps
        # Phase-1 tests exercise the data pipeline only; torch/ultralytics are
        # not needed here and would make CI slow. Heavier training/inference
        # tests get their own job in later phases.
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy Pillow matplotlib PyYAML pytest ruff

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest
